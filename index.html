<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض كورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo}
body{background:#0a0e1a;color:#fff;padding-bottom:20px}
header{background:linear-gradient(90deg,#0f172a,#16a34a);padding:14px;text-align:center}
.match{background:#162032;border:1px solid #ffffff15;border-radius:14px;padding:10px;margin:10px;max-width:700px;margin-left:auto;margin-right:auto}
.top{font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.mid{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.team{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.team img{width:24px;height:24px;background:#fff;border-radius:50%;padding:2px}
.score{background:#0f172a;padding:2px 12px;border-radius:8px;font-weight:800}
.time{font-size:11px;background:#0f172a;margin-top:8px;padding:6px;border-radius:8px;text-align:center;border:1px solid #22c55e20}
.time b{color:#22c55e}
</style>
</head>
<body>
<header><div style="font-size:22px;font-weight:800">⚽ نبض كورة</div><div style="font-size:11px;opacity:.7">بتوقيت المغرب والعالم العربي</div></header>
<div id="box"></div>
<script>
let data=[
{id:1,h:'الوداد',a:'الرجاء',hl:'https://media.api-sports.io/football/teams/1069.png',al:'https://media.api-sports.io/football/teams/1067.png',s:'1-1',t:'20:00',d:'اليوم - السبت 25 أكتوبر'},
{id:2,h:'برشلونة',a:'ريال مدريد',hl:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png',al:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png',s:'2-0',t:'21:00',d:'غدا - الأحد 26 أكتوبر'},
{id:3,h:'بركان',a:'الجيش',hl:'https://media.api-sports.io/football/teams/1040.png',al:'https://media.api-sports.io/football/teams/1016.png',s:'0-0',t:'18:00',d:'اليوم - السبت 25 أكتوبر'}
];
function tm(m){let[h,mm]=m.split(':');h=parseInt(h);let a1=h,a2=h+1,a3=h+2,a4=h+3;if(a2>=24)a2-=24;if(a3>=24)a3-=24;if(a4>=24)a4-=24;return`🇲🇦 <b>${m}</b> | 🇩🇿 ${String(a1).padStart(2,'0')}:${mm} | 🇪🇬 ${String(a2).padStart(2,'0')}:${mm} | 🇸🇦 <b>${String(a3).padStart(2,'0')}:${mm}</b> | 🇦🇪 ${String(a4).padStart(2,'0')}:${mm}`}
let out='';data.forEach(x=>{out+=`<div class="match"><div class="top"><span>📅 ${x.d}</span><span style="color:#ef4444">● مباشر</span></div><div class="mid"><div class="team"><img src="${x.hl}" onerror="this.style.display='none'">${x.h}</div><div class="score">${x.s}</div><div class="team">${x.a}<img src="${x.al}" onerror="this.style.display='none'"></div></div><div class="time">${tm(x.t)}</div></div>`});document.getElementById('box').innerHTML=out;
</script>
</body>
</html>
