
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض كورة - كووورة المغرب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a0e1a;color:#fff}
header{background:linear-gradient(90deg,#0f172a,#16a34a);padding:18px;text-align:center;position:sticky;top:0;z-index:10}
.match{background:#162032;border:1px solid #22c55e33;border-radius:20px;padding:16px;margin:16px auto;max-width:700px;box-shadow:0 8px 24px #0007}
.row{display:flex;justify-content:space-between;align-items:center}
.team{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.team img{width:42px;height:42px;background:#fff;border-radius:50%;padding:4px;object-fit:contain}
.score{font-size:30px;font-weight:800}
.badge{background:#22c55e;color:#000;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:800}
.time-grid{background:#0f172a;border:1px solid #22c55e44;border-radius:14px;padding:12px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.time-grid div{background:#ffffff0f;padding:8px;border-radius:10px;text-align:center}
.card{background:#162032;border:1px solid #22304d;border-radius:18px;padding:14px;margin:16px auto;max-width:700px}
.live{color:#ef4444;animation:blink 1s infinite} @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<header><div style="font-size:28px;font-weight:800">⚽ نبض كورة</div><div style="font-size:13px;opacity:.8">بتوقيت المغرب والعالم العربي</div></header>
<div id="matches"></div>
<div class="card"><h3 style="color:#22c55e">📰 آخر الأخبار</h3><div id="news" style="margin-top:10px;line-height:2.2"></div></div>
<script>
function times(m){
 let [h,mm]=m.split(':').map(Number);
 let add=(x)=>{let n=h+x;if(n>=24)n-=24;return String(n).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
 return {ma:m,dz:m,eg:add(1),sa:add(2),ae:add(3)}
}
const matches=[
{home:'الوداد',hl:'https://upload.wikimedia.org/wikipedia/en/2/2d/Wydad_AC_crest.svg',away:'الرجاء',al:'https://upload.wikimedia.org/wikipedia/en/8/86/Raja_CA_crest.svg',sc:'1 - 1',live:true,t:'20:00',st:'محمد الخامس',co:'جواد بدة'},
{home:'برشلونة',hl:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png',away:'ريال مدريد',al:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png',sc:'2 - 0',live:true,t:'21:00',st:'كامب نو',co:'عصام الشوالي'},
{home:'النهضة البركانية',hl:'https://upload.wikimedia.org/wikipedia/en/6/6b/RS_Berkane_logo.png',away:'الجيش الملكي',al:'https://upload.wikimedia.org/wikipedia/en/7/7a/AS_FAR_logo.svg',sc:'0 - 0',live:false,t:'18:00',st:'البلدي بركان',co:'هشام فرج'},
];
function render(){
 let h='';
 matches.forEach(m=>{
  let tt=times(m.t);
  h+=`<div class="match">
   <div class="row"><span>🏆 ${m.home} vs ${m.away}</span><span class="badge">${m.live?'<span class=live>● مباشر</span>':m.t}</span></div>
   <div class="row" style="margin-top:14px">
    <div class="team"><img src="${m.hl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'"><span>${m.home}</span></div>
    <div class="score">${m.sc}</div>
    <div class="team"><span>${m.away}</span><img src="${m.al}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'"></div>
   </div>
   <div style="margin-top:10px;font-size:12px;opacity:.7">🏟️ ${m.st} | 🎙️ ${m.co}</div>
   <div class="time-grid">
    <div>🇲🇦 المغرب<br><b>${tt.ma}</b></div>
    <div>🇩🇿 الجزائر<br><b>${tt.dz}</b></div>
    <div>🇪🇬 مصر<br><b>${tt.eg}</b></div>
    <div>🇸🇦 السعودية<br><b>${tt.sa}</b></div>
    <div style="grid-column:span 2">🇦🇪 الإمارات<br><b>${tt.ae}</b></div>
   </div>
  </div>`;
 });
 document.getElementById('matches').innerHTML=h;
}
render();
const news=["🔥 الوداد يفوز على الرجاء 2-1 في ديربي مثير","⚽ حكيمي أفضل لاعب في مباراة باريس سان جيرمان","🏆 المغرب يستعد لكأس أفريقيا 2025","💥 برشلونة يتصدر الليغا","🌍 مانشستر سيتي يتعادل مع أرسنال"];
document.getElementById('news').innerHTML=news.map(n=>`<div style="padding:8px 0;border-bottom:1px solid #ffffff11">${n}</div>`).join('');
</script>
</body>
</html>
