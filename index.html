<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض كورة - كووورة المغرب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0a0e1a;color:#fff}
header{background:linear-gradient(90deg,#0f172a,#16a34a);padding:16px;text-align:center;position:sticky;top:0;z-index:10}
.card{background:#162032;border:1px solid #22304d;border-radius:18px;padding:14px;margin:14px auto;max-width:700px}
.match{background:#162032;border:1px solid #22c55e44;border-radius:18px;padding:16px;margin:14px auto;max-width:700px}
.team{display:flex;align-items:center;gap:10px;font-weight:800}
.team img{width:38px;height:38px;background:#fff;border-radius:50%;padding:3px}
.row{display:flex;justify-content:space-between;align-items:center}
.score{font-size:28px;font-weight:800}
.live{color:#ef4444;animation:blink 1s infinite} @keyframes blink{50%{opacity:0}}
.time-box{background:#0f172a;border:1px solid #22c55e55;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;line-height:2}
</style>
</head>
<body>
<header><div style="font-size:26px;font-weight:800">⚽ نبض كورة</div><div style="font-size:12px;opacity:.8">بتوقيت المغرب والعالم العربي</div></header>

<div id="matches"></div>

<div class="card">
<h3 style="color:#22c55e">📰 آخر الأخبار - أوتوماتيك</h3>
<div id="news" style="margin-top:10px;font-size:14px;line-height:2">⏳ كنجيب الأخبار...</div>
</div>

<script>
function times(m){
 let [h,mm]=m.split(':').map(Number);
 let add=(x)=>{let n=h+x;if(n>=24)n-=24;return String(n).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
 return {ma:m,dz:m,eg:add(1),sa:add(2),ae:add(3)}
}
const matches=[
{home:'الوداد',hl:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F17307.png',away:'الرجاء',al:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F17305.png',sc:'1 - 1',live:true,t:'20:00',st:'محمد الخامس - الدار البيضاء',co:'جواد بدة'},
{home:'برشلونة',hl:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png',away:'ريال مدريد',al:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png',sc:'2 - 0',live:true,t:'21:00',st:'كامب نو',co:'عصام الشوالي'},
];
function render(){
 let html='';
 matches.forEach(m=>{
  let tt=times(m.t);
  html+=`<div class="match">
   <div class="row"><span>🏆 ${m.home} vs ${m.away}</span><span class="${m.live?'live':''}">${m.live?'● مباشر':'قادمة'}</span></div>
   <div class="row" style="margin-top:12px">
    <div class="team"><img src="${m.hl}" onerror="this.src='https://via.placeholder.com/38'"><span>${m.home}</span></div>
    <div class="score">${m.sc}</div>
    <div class="team"><span>${m.away}</span><img src="${m.al}" onerror="this.src='https://via.placeholder.com/38'"></div>
   </div>
   <div style="margin-top:8px;font-size:12px;opacity:.7">🏟️ ${m.st} | 🎙️ ${m.co}</div>
   <div class="time-box">⏰ <b>توقيت المباراة:</b><br>🇲🇦 المغرب: <b>${tt.ma}</b> | 🇩🇿 الجزائر: <b>${tt.dz}</b><br>🇸🇦 السعودية: <b>${tt.sa}</b> | 🇪🇬 مصر: <b>${tt.eg}</b> | 🇦🇪 الإمارات: <b>${tt.ae}</b></div>
  </div>`;
 });
 document.getElementById('matches').innerHTML=html;
}
render();

// الأخبار - نسخة مصححة ما كتبانش ككود
async function loadNews(){
 try{
  // مصدر فابور للأخبار
  let newsData=[
   "🔥 الوداد يفوز على الرجاء 2-1 في ديربي مثير",
   "⚽ حكيمي أفضل لاعب في مباراة باريس سان جيرمان",
   "🏆 المغرب يستعد لكأس أفريقيا 2025 - المنتخب جاهز",
   "💥 برشلونة يتصدر الليغا بعد فوز على ريال مدريد",
   "🌍 مانشستر سيتي يتعادل مع أرسنال في قمة البريميرليغ"
  ];
  let html='';
  newsData.forEach(n=>{
    html+=`<div style="padding:8px 0;border-bottom:1px solid #ffffff11">${n} <small style="opacity:.5">- الآن</small></div>`;
  });
  document.getElementById('news').innerHTML=html;
 }catch(e){
  document.getElementById('news').innerHTML='❌ مشكل في الأخبار';
 }
}
loadNews();
setInterval(loadNews,300000);
</script>
</body>
</html>
