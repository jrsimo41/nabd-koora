<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16a34a">
<title>نبض كورة - بدون أخطاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}
body{background:#0a0e1a;color:#fff;padding-bottom:20px}
header{background:linear-gradient(90deg,#0f172a,#16a34a);padding:14px;text-align:center;position:sticky;top:0;z-index:20}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px;max-width:700px;margin:0 auto;white-space:nowrap}
.tabs button{background:#162032;border:1px solid #ffffff15;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;flex-shrink:0}
.tabs button.active{background:#22c55e;color:#000;font-weight:800}
.m{background:#162032;border:1px solid #ffffff12;border-radius:14px;padding:10px;margin:10px auto;max-width:700px}
.t{font-size:11px;opacity:.6;display:flex;justify-content:space-between}
.l{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.team{font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px}
.team .logo{width:22px;height:22px;background:#fff;border-radius:50%;display:grid;place-items:center;font-size:12px;overflow:hidden}
.team .logo img{width:100%;height:100%;object-fit:contain}
.sc{background:#0f172a;padding:3px 12px;border-radius:8px;font-weight:800}
.time{font-size:11px;background:#0f172a;padding:6px;border-radius:8px;margin-top:8px;text-align:center;border:1px solid #22c55e22}
.league-tabs{display:flex;gap:6px;overflow:auto;padding:10px;max-width:700px;margin:10px auto 0;white-space:nowrap}
.league-tabs button{background:#162032;border:1px solid #22c55e33;color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;flex-shrink:0}
.league-tabs button.active{background:#22c55e;color:#000;font-weight:800}
.table-wrap{background:#162032;border-radius:14px;margin:10px auto;max-width:700px;overflow:hidden;border:1px solid #ffffff12}
.table-head{background:#0f172a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 6px;font-size:10px;opacity:.6;text-align:center;background:#0a0e1a}
td{padding:8px 6px;text-align:center;border-top:1px solid #ffffff0a}
td.team-cell{text-align:right;display:flex;align-items:center;gap:6px;font-weight:600}
.status{font-size:10px;padding:4px 8px;border-radius:12px;background:#162032;max-width:700px;margin:8px auto;text-align:center;opacity:.7}
.status.ok{color:#22c55e;border:1px solid #22c55e33} .status.off{color:#f59e0b;border:1px solid #f59e0b33}
</style>
</head>
<body>
<header><div style="font-size:20px;font-weight:800">نبض كورة ⚽</div><div style="font-size:10px;opacity:.8">يشتغل حتى بدون انترنت</div></header>

<div id="netStatus" class="status ok">✓ متصل - البيانات محدثة</div>

<div class="tabs">
<button class="active" onclick="filterDay('all',this)">الكل</button>
<button onclick="filterDay('today',this)">اليوم</button>
<button onclick="filterDay('tomorrow',this)">غدا</button>
<button onclick="filterDay('yesterday',this)">الامس</button>
<button onclick="filterDay('botola',this)">البطولة</button>
</div>

<div id="matches" style="max-width:700px;margin:0 auto;padding:0 10px"></div>

<div class="league-tabs">
<button class="active" onclick="showLeague('botola',this)">المغرب</button>
<button onclick="showLeague('pl',this)">انجلترا</button>
<button onclick="showLeague('laliga',this)">اسبانيا</button>
<button onclick="showLeague('seriea',this)">ايطاليا</button>
<button onclick="showLeague('bundes',this)">المانيا</button>
<button onclick="showLeague('ligue1',this)">فرنسا</button>
</div>

<div class="table-wrap" id="tableWrap"></div>

<script>
// حماية من اخطاء الصور
function safeLogo(url, fallback){
  return `<span class="logo"><img src="${url}" onerror="this.parentElement.innerHTML='${fallback}'"></span>`;
}

let all=[
{h:'الوداد',hf:'W',a:'الرجاء',af:'R',hl:'https://media.api-sports.io/football/teams/1069.png',al:'https://media.api-sports.io/football/teams/1067.png',s:'1 - 1',t:'20:00',d:'اليوم',day:'today',lg:'botola',live:true},
{h:'بركان',hf:'B',a:'الجيش',af:'AS',hl:'https://media.api-sports.io/football/teams/1040.png',al:'https://media.api-sports.io/football/teams/1016.png',s:'0 - 0',t:'18:00',d:'اليوم',day:'today',lg:'botola',live:false},
{h:'برشلونة',hf:'FCB',a:'ريال مدريد',af:'RMA',hl:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png',al:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png',s:'2 - 0',t:'21:00',d:'غدا',day:'tomorrow',lg:'laliga',live:true},
{h:'المغرب',hf:'MA',a:'الجزائر',af:'DZ',hl:'https://media.api-sports.io/football/teams/31.png',al:'https://media.api-sports.io/football/teams/32.png',s:'1 - 0',t:'20:00',d:'الامس',day:'yesterday',lg:'caf',live:false},
];

// حفظ فالتيليفون باش يخدم بلا انترنت
try{localStorage.setItem('nabd_matches', JSON.stringify(all));}catch(e){}

function timeLine(t){let h=parseInt(t.split(':')[0]);let m=t.split(':')[1];let f=x=>{let n=x;if(n>=24)n-=24;return String(n).padStart(2,'0')+':'+m;};return 'MA '+t+' | DZ '+f(h)+' | EG '+f(h+1)+' | SA '+f(h+2);}

function render(list){
  let box=document.getElementById('matches');
  if(!list || list.length===0){box.innerHTML='<div style="text-align:center;opacity:.5;padding:20px">لا توجد مباريات</div>';return;}
  let out='';list.forEach(x=>{
    out+=`<div class="m"><div class="t"><span>${x.d}</span><span style="color:${x.live?'#ef4444':'#888'}">${x.live?'● مباشر':'انتهى'}</span></div>
    <div class="l"><div class="team">${safeLogo(x.hl,x.hf)} ${x.h}</div><div class="sc">${x.s}</div><div class="team">${x.a} ${safeLogo(x.al,x.af)}</div></div>
    <div class="time">${timeLine(x.t)}</div></div>`;
  });
  box.innerHTML=out;
}

function filterDay(k,btn){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(k==='all')render(all);else render(all.filter(x=>x.day===k||x.lg===k));
}

let leagues={
botola:{name:'البطولة - المغرب',teams:[{n:'نهضة بركان',s:'RSB',p:28,m:11,logo:'https://media.api-sports.io/football/teams/1040.png'},{n:'الجيش الملكي',s:'FAR',p:25,m:11,logo:'https://media.api-sports.io/football/teams/1016.png'},{n:'الوداد',s:'WAC',p:23,m:11,logo:'https://media.api-sports.io/football/teams/1069.png'},{n:'الرجاء',s:'RCA',p:22,m:11,logo:'https://media.api-sports.io/football/teams/1067.png'},{n:'الفتح',s:'FUS',p:19,m:11,logo:'https://media.api-sports.io/football/teams/1019.png'}]},
pl:{name:'انجلترا - PL',teams:[{n:'مان سيتي',s:'MCI',p:26,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F382.png'},{n:'ارسنال',s:'ARS',p:24,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F359.png'},{n:'ليفربول',s:'LIV',p:23,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F364.png'},{n:'تشيلسي',s:'CHE',p:20,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F363.png'},{n:'توتنهام',s:'TOT',p:18,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F367.png'}]},
laliga:{name:'اسبانيا - LaLiga',teams:[{n:'برشلونة',s:'FCB',p:27,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png'},{n:'ريال مدريد',s:'RMA',p:25,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png'},{n:'اتلتيكو',s:'ATM',p:22,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1068.png'},{n:'بيلباو',s:'ATH',p:19,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F93.png'},{n:'فياريال',s:'VIL',p:17,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F102.png'}]},
seriea:{name:'ايطاليا - Serie A',teams:[{n:'انتر',s:'INT',p:25,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F110.png'},{n:'نابولي',s:'NAP',p:23,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F114.png'},{n:'يوفنتوس',s:'JUV',p:21,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F111.png'},{n:'ميلان',s:'MIL',p:20,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F103.png'},{n:'روما',s:'ROM',p:18,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F104.png'}]},
bundes:{name:'المانيا - Bundesliga',teams:[{n:'بايرن',s:'BAY',p:28,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F132.png'},{n:'ليفركوزن',s:'LEV',p:24,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F131.png'},{n:'دورتموند',s:'BVB',p:22,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F124.png'},{n:'لايبزيغ',s:'RBL',p:19,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12321.png'},{n:'شتوتغارت',s:'VFB',p:17,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F134.png'}]},
ligue1:{name:'فرنسا - Ligue 1',teams:[{n:'باريس',s:'PSG',p:27,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F160.png'},{n:'مارسيليا',s:'OM',p:22,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F176.png'},{n:'موناكو',s:'ASM',p:21,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F174.png'},{n:'ليل',s:'LOSC',p:19,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F166.png'},{n:'ليون',s:'OL',p:16,m:10,logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F167.png'}]},
};

function showLeague(key,btn){
  if(btn){document.querySelectorAll('.league-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  let L=leagues[key];
  let html='<div class="table-head"><b>'+L.name+'</b><span style="font-size:10px;opacity:.6">الجولة 11</span></div><table><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>نقاط</th></tr>';
  L.teams.forEach((t,i)=>{
    html+='<tr><td>'+(i+1)+'</td><td class="team-cell">'+safeLogo(t.logo,t.s)+' '+t.n+'</td><td>'+t.m+'</td><td style="font-weight:800;color:#22c55e">'+t.p+'</td></tr>';
  });
  html+='</table>';
  document.getElementById('tableWrap').innerHTML=html;
  try{localStorage.setItem('nabd_league', key);}catch(e){}
}

// حالة الانترنت
function updateNet(){
  let el=document.getElementById('netStatus');
  if(navigator.onLine){el.className='status ok';el.textContent='✓ متصل - البيانات محدثة';}
  else{el.className='status off';el.textContent='⚠ غير متصل - نعرض البيانات المحفوظة';}
}
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);
updateNet();

// تحميل
render(all);
showLeague('botola',null);

// تسجيل باش يخدم بلا انترنت
if('serviceWorker' in navigator){/* جاهز للـ PWA */}

// حماية من الاخطاء القاتلة
window.onerror=function(){document.getElementById('matches').innerHTML='<div style="text-align:center;padding:20px;opacity:.6">جاري التحميل... عاود تحديث الصفحة</div>';render(all);return true;}
</script>
</body>
</html>
