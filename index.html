<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض كورة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,sans-serif}
body{background:#0a0e1a;color:#fff}
header{background:linear-gradient(90deg,#0f172a,#16a34a);padding:12px;text-align:center;position:sticky;top:0;z-index:10}
.tabs,.league-tabs{display:flex;gap:6px;overflow:auto;padding:8px;max-width:700px;margin:0 auto;white-space:nowrap;scrollbar-width:none}
.tabs button,.league-tabs button{background:#162032;border:1px solid #ffffff15;color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;flex-shrink:0}
.tabs button.active,.league-tabs button.active{background:#22c55e;color:#000;font-weight:800}
.m{background:#162032;border-radius:12px;padding:10px;margin:8px auto;max-width:700px;border:1px solid #ffffff0f}
.badge{width:24px;height:24px;min-width:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.team{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.sc{background:#0f172a;padding:2px 10px;border-radius:6px;font-weight:800}
.time{font-size:11px;background:#0f172a;padding:5px;border-radius:6px;margin-top:6px;text-align:center;border:1px solid #22c55e22;color:#22c55e}
.table-wrap{background:#162032;border-radius:12px;margin:10px auto;max-width:700px;overflow:hidden;border:1px solid #ffffff12}
.table-head{background:#0f172a;padding:10px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px;background:#0a0e1a;opacity:.6;font-size:10px}
td{padding:9px 6px;text-align:center;border-top:1px solid #ffffff0a}
td.team-cell{text-align:right;display:flex;align-items:center;gap:8px}
img.logo{width:20px;height:20px;background:#fff;border-radius:50%;padding:1px;object-fit:contain}
</style>
</head>
<body>
<header><b>نبض كورة ⚽</b><div style="font-size:10px;opacity:.7">سريع وخفيف وبدون اخطاء</div></header>

<div class="tabs">
<button class="active" onclick="filterDay('all',this)">الكل</button>
<button onclick="filterDay('today',this)">اليوم</button>
<button onclick="filterDay('tomorrow',this)">غدا</button>
<button onclick="filterDay('yesterday',this)">الامس</button>
</div>
<div id="matches" style="padding:0 8px"></div>

<div class="league-tabs">
<button class="active" onclick="showLeague('botola',this)">المغرب</button>
<button onclick="showLeague('pl',this)">انجلترا</button>
<button onclick="showLeague('laliga',this)">اسبانيا</button>
<button onclick="showLeague('seriea',this)">ايطاليا</button>
<button onclick="showLeague('bundes',this)">المانيا</button>
<button onclick="showLeague('ligue1',this)">فرنسا</button>
</div>
<div class="table-wrap" id="tableWrap"></div>

<script>
let all=[
{h:'الوداد',c:'#cc0000',s:'WAC',a:'الرجاء',ac:'#009900',as:'RCA',sc:'1-1',d:'اليوم',day:'today'},
{h:'بركان',c:'#ff6600',s:'RSB',a:'الجيش',ac:'#000',as:'FAR',sc:'0-0',d:'اليوم',day:'today'},
{h:'برشلونة',c:'#004d98',s:'FCB',a:'ريال مدريد',ac:'#fff',as:'RMA',sc:'21:00',d:'غدا',day:'tomorrow'},
{h:'المغرب',c:'#c00000',s:'MAR',a:'الجزائر',ac:'#006600',as:'ALG',sc:'1-0',d:'الامس',day:'yesterday'},
];

function render(list){
let out='';
list.forEach(x=>{
let hl='<span class="badge" style="background:'+x.c+'">'+x.s+'</span>';
let al='<span class="badge" style="background:'+x.ac+';color:'+(x.ac=='#fff'?'#000':'#fff')+'">'+x.as+'</span>';
out+='<div class="m"><div style="font-size:11px;opacity:.6;display:flex;justify-content:space-between"><span>'+x.d+'</span><span>مباشر</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><div class="team">'+hl+' '+x.h+'</div><div class="sc">'+x.sc+'</div><div class="team">'+x.a+' '+al+'</div></div><div class="time">MA 20:00 | EG 21:00 | SA 22:00</div></div>';
});
document.getElementById('matches').innerHTML=out;
}
function filterDay(k,btn){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
if(k=='all')render(all);else render(all.filter(x=>x.day==k));
}

let leagues={
botola:{name:'البطولة المغربية',teams:[
{n:'نهضة بركان',c:'#ff6600',s:'RSB',p:28,m:11},
{n:'الجيش الملكي',c:'#000',s:'FAR',p:25,m:11},
{n:'الوداد',c:'#cc0000',s:'WAC',p:23,m:11},
{n:'الرجاء',c:'#009900',s:'RCA',p:22,m:11},
{n:'الفتح',c:'#0033cc',s:'FUS',p:19,m:11},
]},
pl:{name:'الدوري الانجليزي',teams:[
{n:'مان سيتي',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F382.png',s:'MCI',p:26,m:10},
{n:'ارسنال',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F359.png',s:'ARS',p:24,m:10},
{n:'ليفربول',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F364.png',s:'LIV',p:23,m:10},
{n:'تشيلسي',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F363.png',s:'CHE',p:20,m:10},
{n:'توتنهام',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F367.png',s:'TOT',p:18,m:10},
]},
laliga:{name:'الدوري الاسباني',teams:[
{n:'برشلونة',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F83.png',s:'FCB',p:27,m:10},
{n:'ريال مدريد',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F86.png',s:'RMA',p:25,m:10},
{n:'اتلتيكو',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1068.png',s:'ATM',p:22,m:10},
{n:'بيلباو',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F93.png',s:'ATH',p:19,m:10},
{n:'فياريال',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F102.png',s:'VIL',p:17,m:10},
]},
seriea:{name:'الدوري الايطالي',teams:[
{n:'انتر',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F110.png',s:'INT',p:25,m:10},
{n:'نابولي',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F114.png',s:'NAP',p:23,m:10},
{n:'يوفنتوس',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F111.png',s:'JUV',p:21,m:10},
{n:'ميلان',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F103.png',s:'MIL',p:20,m:10},
{n:'روما',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F104.png',s:'ROM',p:18,m:10},
]},
bundes:{name:'الدوري الالماني',teams:[
{n:'بايرن',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F132.png',s:'BAY',p:28,m:10},
{n:'ليفركوزن',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F131.png',s:'LEV',p:24,m:10},
{n:'دورتموند',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F124.png',s:'BVB',p:22,m:10},
{n:'لايبزيغ',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12321.png',s:'RBL',p:19,m:10},
{n:'شتوتغارت',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F134.png',s:'VFB',p:17,m:10},
]},
ligue1:{name:'الدوري الفرنسي',teams:[
{n:'باريس',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F160.png',s:'PSG',p:27,m:10},
{n:'مارسيليا',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F176.png',s:'OM',p:22,m:10},
{n:'موناكو',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F174.png',s:'ASM',p:21,m:10},
{n:'ليل',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F166.png',s:'LOS',p:19,m:10},
{n:'ليون',logo:'https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F167.png',s:'OL',p:16,m:10},
]},
};

function showLeague(key,btn){
if(btn){
document.querySelectorAll('.league-tabs button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
let L=leagues[key];
let html='<div class="table-head"><b>'+L.name+'</b><span style="font-size:10px;opacity:.6">الجولة 11</span></div><table><tr><th>#</th><th style="text-align:right">الفريق</th><th>لعب</th><th>نقاط</th></tr>';
L.teams.forEach((t,i)=>{
let logoPart;
if(t.logo){
logoPart='<img class="logo" src="'+t.logo+'">';
}else{
logoPart='<span class="badge" style="background:'+t.c+'">'+t.s+'</span>';
}
html+='<tr><td>'+(i+1)+'</td><td class="team-cell">'+logoPart+' '+t.n+'</td><td>'+t.m+'</td><td style="color:#22c55e;font-weight:800">'+t.p+'</td></tr>';
});
html+='</table>';
document.getElementById('tableWrap').innerHTML=html;
}
render(all);
showLeague('botola',null);
</script>
</body>
</html>
